<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campings de France – Caravanes &amp; camping-cars</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#fff7e6;--card:#fffdf8;--tx:#2b2a44;--mu:#6b6a85;--h1:#2bb3ea;--h2:#8fe0f5;--h3:#ffd35c;--coral:#ff6b5b;--shadow:0 6px 0 rgba(255,170,60,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#1b2140;--card:#262d55;--tx:#fff4e0;--mu:#b9b8dd;--h1:#5b3fd1;--h2:#e0589b;--h3:#ff9e4a;--shadow:0 6px 0 rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif}
header{position:relative;overflow:hidden;padding:22px 20px 48px;background:linear-gradient(165deg,var(--h1),var(--h2) 55%,var(--h3));color:#fff;text-align:center}
header h1{margin:0;font-size:1.9rem;font-weight:800;text-shadow:0 3px 0 rgba(0,0,0,.18)}
header p{margin:2px 0 0;font-size:1.05rem;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.sun{position:absolute;top:10px;right:18px;font-size:2.4rem}.deco{position:absolute;left:16px;top:12px;font-size:1.9rem}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:34px}.wave path{fill:var(--bg)}
.search{display:flex;gap:10px;padding:0 20px;margin-top:-6px}
input[type=search]{flex:1;min-width:0;padding:14px 20px;font:inherit;font-size:1.05rem;border:3px solid var(--coral);border-radius:999px;background:var(--card);color:var(--tx);box-shadow:var(--shadow);outline:none}
button{font:inherit;cursor:pointer}
.go{padding:12px 20px;border:0;border-radius:999px;background:var(--coral);color:#fff;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.chips{display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px 6px}
.chip{--c:#ff6b5b;padding:9px 16px;border-radius:999px;border:3px solid var(--c);background:var(--card);color:var(--tx);font-weight:700}
.chip[aria-pressed=true]{background:var(--c);color:#fff}
.layout{display:grid;gap:14px;padding:8px 20px 24px}
#map{height:42vh;min-height:280px;border:3px solid var(--coral);border-radius:22px;box-shadow:var(--shadow);z-index:0}
.zone{position:absolute}
.pin{font-size:1.7rem;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.status{padding:4px 22px;color:var(--mu);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-content:start}
.card{--c:#ff6b5b;background:var(--card);border:3px solid var(--c);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:1.15rem;font-weight:800}
.meta{color:var(--mu);font-size:.92rem;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:var(--c);color:#fff;border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.btn{padding:9px 14px;border-radius:999px;background:var(--coral);color:#fff;text-decoration:none;font-weight:800;border:0;font-size:.95rem}
.btn.alt{background:#2bb3ea}
footer{padding:0 22px 28px;color:var(--mu);font-size:.85rem}
@media (min-width:900px){.layout{grid-template-columns:1fr 1fr;align-items:start}#map{position:sticky;top:12px;height:calc(100vh - 24px)}}
</style>
</head>
<body>
<header>
<span class="deco">🌴</span><span class="sun">☀️</span>
<h1>🏕️ Campings de France</h1>
<p>Cap sur les vacances en caravane ou camping-car !</p>
<svg class="wave" viewBox="0 0 400 36" preserveAspectRatio="none" aria-hidden="true"><path d="M0 18 Q50 0 100 18 T200 18 T300 18 T400 18 V36 H0Z"/></svg>
</header>
<form class="search" id="sf"><input type="search" id="q" placeholder="🔎 Une ville ou une région…"><button class="go" type="submit">Go !</button></form>
<div class="chips" id="chips"></div>
<div class="layout">
<div id="map"></div>
<div>
<div class="status" id="status">Cherche une ville, puis appuie sur « Chercher dans cette zone ».</div>
<div style="padding:0 0 12px"><button class="go" id="zone" type="button">🔄 Chercher dans cette zone</button></div>
<div class="grid" id="grid"></div>
</div>
</div>
<footer>Données © contributeurs OpenStreetMap. Les informations (électricité, vidange, wifi…) dépendent de ce que les contributeurs ont renseigné.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var LAB={caravane:"🚙 Caravane","camping-car":"🚐 Camping-car",electricite:"⚡ Électricité",vidange:"💧 Vidange",wifi:"📶 Wifi",animaux:"🐶 Animaux admis",annee:"☀️ Ouvert toute l’année"};
var COL={caravane:"#2bb3ea","camping-car":"#8a5cf6",electricite:"#f5a300",vidange:"#14b8a6",wifi:"#ec4899",animaux:"#f97316",annee:"#ef4444"};
var CARD=["#ff6b5b","#2bb3ea","#f5a300","#14b8a6","#8a5cf6","#ec4899"];
var on={},items=[],markers=L.layerGroup();
var map=L.map("map").setView([46.6,2.4],6);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);
markers.addTo(map);
var chips=document.getElementById("chips"),grid=document.getElementById("grid"),st=document.getElementById("status");
Object.keys(LAB).forEach(function(k){
 var b=document.createElement("button");b.className="chip";b.textContent=LAB[k];b.style.setProperty("--c",COL[k]);b.setAttribute("aria-pressed","false");
 b.onclick=function(){on[k]=!on[k];b.setAttribute("aria-pressed",on[k]?"true":"false");render();};
 chips.appendChild(b);
});
function feats(t){
 var f=[];
 if(t.caravans==="yes"||(t.tourism==="camp_site"&&t.caravans!=="no"))f.push("caravane");
 if(t.motorhome==="yes"||t.tourism==="caravan_site")f.push("camping-car");
 if(t.power_supply==="yes")f.push("electricite");
 if(t.sanitary_dump_station==="yes")f.push("vidange");
 if(t.internet_access==="wlan"||t.internet_access==="yes")f.push("wifi");
 if(t.dog==="yes")f.push("animaux");
 if(t.seasonal==="no"||t.opening_hours==="24/7")f.push("annee");
 return f;
}
function render(){
 markers.clearLayers();grid.innerHTML="";
 var res=items.filter(function(c){for(var k in on){if(on[k]&&c.t.indexOf(k)<0)return false;}return true;});
 if(items.length)st.textContent="🎒 "+res.length+" sur "+items.length+" campings dans cette zone";
 res.forEach(function(c,i){
  var m=L.marker([c.lat,c.lng],{icon:L.divIcon({html:"📍",className:"pin",iconSize:[28,28],iconAnchor:[14,26]})});
  m.bindPopup(document.createTextNode(c.n).textContent);markers.addLayer(m);
  var d=document.createElement("div");d.className="card";d.style.setProperty("--c",CARD[i%CARD.length]);
  var h=document.createElement("h2");h.textContent=c.n;d.appendChild(h);
  if(c.addr){var a=document.createElement("div");a.className="meta";a.textContent="📌 "+c.addr;d.appendChild(a);}
  if(c.oh){var o=document.createElement("div");o.className="meta";o.textContent="🕒 "+c.oh;d.appendChild(o);}
  var tg=document.createElement("div");tg.className="tags";
  c.t.forEach(function(k){var e=document.createElement("span");e.className="tag";e.textContent=LAB[k];tg.appendChild(e);});
  d.appendChild(tg);
  var r=document.createElement("div");r.className="row";
  var g=document.createElement("a");g.className="btn";g.target="_blank";g.rel="noopener";g.textContent="📍 Google Maps";
  g.href="https://www.google.com/maps/search/?api=1&query="+c.lat+","+c.lng;r.appendChild(g);
  var s=document.createElement("button");s.className="btn alt";s.textContent="🗺️ Voir sur la carte";
  s.onclick=function(){map.setView([c.lat,c.lng],15);m.openPopup();window.scrollTo({top:0,behavior:"smooth"});};r.appendChild(s);
  if(c.web&&/^https?:\/\//.test(c.web)){var w=document.createElement("a");w.className="btn alt";w.target="_blank";w.rel="noopener";w.textContent="🌐 Site";w.href=c.web;r.appendChild(w);}
  d.appendChild(r);grid.appendChild(d);
 });
}
function load(){
 if(map.getZoom()<9){st.textContent="🔍 Zoome un peu (ou cherche une ville) pour lancer la recherche.";return;}
 var b=map.getBounds(),bb=b.getSouth()+","+b.getWest()+","+b.getNorth()+","+b.getEast();
 var qy='[out:json][timeout:25];(nwr["tourism"="camp_site"]('+bb+');nwr["tourism"="caravan_site"]('+bb+'););out center tags 300;';
 st.textContent="⏳ Recherche en cours…";
 fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(qy),headers:{"Content-Type":"application/x-www-form-urlencoded"}})
 .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
 .then(function(j){
  items=j.elements.map(function(e){
   var t=e.tags||{},lat=e.lat||(e.center&&e.center.lat),lng=e.lon||(e.center&&e.center.lon);
   var addr=[t["addr:housenumber"],t["addr:street"],t["addr:city"]].filter(Boolean).join(" ");
   return {n:t.name||"Camping sans nom",lat:lat,lng:lng,t:feats(t),addr:addr,oh:t.opening_hours,web:t.website||t["contact:website"]};
  }).filter(function(c){return c.lat&&c.lng;});
  if(!items.length)st.textContent="😕 Aucun camping trouvé ici. Essaie de dézoomer un peu.";
  render();
 })
 .catch(function(){st.textContent="⚠️ Le service de données ne répond pas. Réessaie dans un instant.";});
}
document.getElementById("zone").onclick=load;
document.getElementById("sf").onsubmit=function(ev){
 ev.preventDefault();var v=document.getElementById("q").value.trim();if(!v)return;
 st.textContent="⏳ Recherche du lieu…";
 fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q="+encodeURIComponent(v))
 .then(function(r){return r.json();})
 .then(function(j){
  if(!j.length){st.textContent="😕 Lieu introuvable.";return;}
  var p=j[0];if(p.boundingbox){map.fitBounds([[+p.boundingbox[0],+p.boundingbox[2]],[+p.boundingbox[1],+p.boundingbox[3]]]);}else map.setView([+p.lat,+p.lon],11);
  if(map.getZoom()>12)map.setZoom(11);
  load();
 })
 .catch(function(){st.textContent="⚠️ Recherche du lieu impossible pour le moment.";});
};
</script>
</body>
</html>
